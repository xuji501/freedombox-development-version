# FreedomBox 定制版 · 部署参数
#
# 这个文件在 deploy.sh 里被 source，语法就是普通的 shell 变量赋值。
# 改完直接重新执行 deploy.sh 即可；已部署的步骤默认跳过，
# 想强制重跑某一步用 --force。
#
# 注意：本文件会被 root shell 读取，只放变量赋值，不要写命令。

# ---------------------------------------------------------------------------
# 首次启动向导自动化（管理员账号）
# ---------------------------------------------------------------------------
# 部署过程会把 FreedomBox 的首次启动向导自动走完，这里指定建成什么账号。
# 密码留空则自动生成 16 位随机串，写入 /root/freedombox-admin-password.txt
# 并在部署结束时打印；部署完成后请尽快登录改掉。
# 密码请只用字母和数字：太长的特殊字符在串口/控制台粘贴容易出错。
ADMIN_USER="admin"
ADMIN_PASSWORD=""

# ---------------------------------------------------------------------------
# 页脚版权文案（出现在所有页面底部）
# ---------------------------------------------------------------------------
FOOTER_TEXT="FreedomBox 定制版，起点火箭开发 20261028，版本号 v1.0.1"

# ---------------------------------------------------------------------------
# OpenVPN
# ---------------------------------------------------------------------------
# 服务端端口。留空表示自动判断：机器上已有配置就沿用原端口，否则用 1194。
# 这个端口一旦被客户端 profile 引用，之后改动需要重新下发 profile。
OVPN_PORT=""

# 认证方式：
#   cert    —— 仅客户端证书（官方默认行为）
#   cert+pw —— 证书 + 用户名密码，账号在 OpenVPN 页面里管理
# 默认 cert+pw：本定制包的核心就是账号管理，纯证书模式下账号功能用不上。
# 选 cert+pw 但一个账号都没建时，任何客户端都连不上，务必先去页面建账号。
OVPN_AUTH_MODE="cert+pw"

# ---------------------------------------------------------------------------
# IPv6 内网
# ---------------------------------------------------------------------------
# 内网 ULA 前缀。留空表示由模块自动探测/生成（推荐，避免多台设备前缀冲突）。
# 想和现网保持一致可以填：IPV6_PREFIX="fd12:3456:7890::/64"
IPV6_PREFIX=""

# 部署完成后是否立刻打开 IPv6 内网路由通告（1=打开，0=不动网络）。
# 打开会修改 sysctl 转发、启动 radvd 等效的 dnsmasq RA 与 NAT66 规则，
# 属于会改变网络行为的操作，默认关闭，请在页面上确认后再开。
IPV6_ENABLE_LAN=0

# ---------------------------------------------------------------------------
# DHCP
# ---------------------------------------------------------------------------
# 部署完成后是否立刻启用 DHCP 服务（1=启用，0=只装不启用）。
# 启用会把内网网卡切成静态地址并由本机接管 DHCP/DNS，属于会断网的操作，
# 默认关闭，请在页面上确认网卡与地址池后再开。
DHCP_AUTO_ENABLE=0
